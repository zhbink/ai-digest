<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- video.twimg.com rejects requests with a foreign Referer (403) — send none so hot-linked mp4s play -->
  <meta name="referrer" content="no-referrer" />
  <title>AI 日报 · X Digest</title>
  <link rel="icon" href="static/favicon-32.png?v=7d22a05608" type="image/png" sizes="32x32" />
  <link rel="icon" href="static/icon-192.png?v=34100f2c77" type="image/png" sizes="192x192" />
  <link rel="icon" href="static/favicon.ico?v=f851dcf12b" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="static/apple-touch-icon.png?v=009a80ffdd" />
  <link rel="manifest" href="static/site.webmanifest?v=c5f6bd04c2" />
  <meta name="theme-color" content="#090d24" />
  <link rel="stylesheet" href="static/styles.css?v=459c646953" />
  <!-- 访问密码：没有已验证的密码时，先锁住页面（在任何内容渲染前） -->
  <script>(function(){var d=document.documentElement,c=null;try{c=JSON.parse(localStorage.getItem("aidigest.sync")||"null")}catch(e){}if(!(c&&c.key&&c.url))d.className+=" locked"})()</script>
  <style>html.locked body>:not(#gate){display:none!important}#gate{display:none}html.locked #gate{display:flex}</style>
</head>
<body>
  <div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <form class="gate-panel" id="gateForm" method="post" action="#" novalidate>
      <img class="gate-logo" src="static/logo.png?v=34100f2c77" alt="" width="72" height="72" />
      <h1 class="gate-title" id="gateTitle">AI Digest</h1>
      <p class="gate-sub">请输入访问密码</p>
      <input type="text" name="username" value="ai-digest" autocomplete="username" hidden aria-hidden="true" tabindex="-1" />
      <input id="gatePw" class="gate-input" name="password" type="password" placeholder="访问密码" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" required />
      <p class="gate-err" id="gateErr" role="alert"></p>
      <button type="submit" class="gate-btn" id="gateBtn">进入</button>
    </form>
  </div>
  <div class="app">
    <div class="mbar" id="mbar">
      <div class="mbar-row">
        <img class="mbar-logo" src="static/logo.png?v=34100f2c77" alt="" width="26" height="26" />
        <span class="mbar-title">AI 日报</span>
        <div class="mbar-date" id="mbarDate"></div>
        <button type="button" class="mbar-btn" id="mbSearch" aria-label="搜索" title="搜索作者 / 关键词"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
        <button type="button" class="mbar-btn mb-follow" id="mbFollow" aria-label="我的关注" title="我的关注">★<span id="mbFollowCount">0</span></button>
        <button type="button" class="mbar-btn" id="mbMore" aria-label="更多" title="更多">⋯</button>
      </div>
      <div class="mbar-search" id="mbarSearch" hidden></div>
      <div class="mbar-menu" id="mbMenu" hidden>
        <button type="button" data-act="export">⤓ 导出 JSON（当日 / 我的关注）</button>
        <button type="button" data-act="config">⚙ 配置（信息收集策略）</button>
        <button type="button" data-act="sync" class="mb-sync">云同步 · <span data-sync-status hidden></span></button>
        <button type="button" data-act="logout">⎋ 退出登录</button>
      </div>
    </div>
    <header class="top">
      <div class="brand">
        <img class="logo" src="static/logo.png?v=34100f2c77" alt="" width="48" height="48" />
        <div>
          <div class="title-row"><h1>AI 日报</h1><a id="configLink" class="config-link" href="?view=config" title="查看当前的信息收集策略">⚙ 配置</a></div>
          <p class="sub">X 平台 Agent / 中文圈 / AI 视频 · 站内可读全文</p>
        </div>
      </div>
      <div class="controls">
        <div class="field">
          <span id="dateLabel">日期</span>
          <div id="datePicker" aria-labelledby="dateLabel"></div>
        </div>
        <label class="field grow">
          <span>搜索作者 / 关键词</span>
          <input id="search" type="search" placeholder="如 omarsar0、可灵、evals…" />
        </label>
      </div>
    </header>

    <section class="trend" id="trendBox" hidden>
      <h2>今日趋势</h2>
      <p id="trendText"></p>
      <div class="stats" id="stats"></div>
    </section>

    <div class="tabbar">
      <nav class="tabs" id="tabs">
        <button data-section="" class="active">全部</button>
        <button data-section="agent">AI Agent 动态</button>
        <button data-section="models">模型与大佬</button>
        <button data-section="coding">AI 编程</button>
        <button data-section="creative">图像·语音·音乐</button>
        <button data-section="industry">算力与融资</button>
        <button data-section="zh">中文圈精选</button>
        <button data-section="video">AI 视频创作</button>
        <button data-section="gossip">花边八卦</button>
      </nav>
      <button type="button" class="sync-chip" data-sync-status id="syncChip" hidden>☁</button>
      <button id="followTab" class="follow-tab" type="button" title="我的关注（已同步到云端）">★ 我的关注 <span class="count" id="followCount">0</span></button>
    </div>

    <div class="toolbar" id="dayTools">
      <div class="seg" id="sortSeg" role="group" aria-label="排序">
        <button type="button" data-sort="rec" title="按推荐分从高到低">推荐</button>
        <button type="button" data-sort="new" title="按发布时间从新到旧">最新</button>
      </div>
      <button type="button" class="chip-toggle" id="recOnly" aria-pressed="false" title="只显示推荐（推荐分高、创业者值得关注）">只看推荐</button>
      <span class="toolbar-hint">推荐分：从创业者视角评估的重要程度</span>
      <span class="spacer"></span>
      <button type="button" class="btn ghost sm" id="dayExport" title="下载当日全部帖子（含图片/视频链接）为 JSON">导出当日</button>
    </div>

    <div class="toolbar follow-bar" id="followBar" hidden>
      <div class="follow-title" id="followTitle">我的关注</div>
      <span class="spacer"></span>
      <button type="button" class="chip-toggle" id="followToday" aria-pressed="false">只看当天</button>
      <button type="button" class="btn ghost sm" id="followExport" title="下载为 JSON 文件">导出</button>
      <button type="button" class="btn ghost sm" id="followImport" title="从导出的 JSON 文件导入（与现有关注合并）">导入</button>
      <input type="file" id="followFile" accept="application/json,.json" hidden />
    </div>

    <section id="configView" class="config" hidden aria-live="polite"></section>

    <div class="feed-wrap" id="feedWrap">
      <main id="feed" class="feed"></main>
      <aside id="cmRail" class="cm-rail" aria-label="评论"></aside>
    </div>
    <p id="empty" class="empty" hidden>这一天还没有内容。</p>
  </div>

  <div id="reader" class="reader" hidden>
    <div class="reader-panel">
      <header class="reader-top">
        <button id="closeReader" type="button">← 返回</button>
        <span id="readerKind" class="reader-kind" hidden></span>
        <span class="reader-actions">
          <button id="readerFollow" class="reader-follow" type="button" data-follow="" hidden>☆ 关注</button>
          <button id="readerCm" class="reader-cm" type="button" hidden>✎ 评论</button>
          <button id="readerTr" type="button" hidden>查看原文</button>
          <a id="readerSource" href="#" target="_blank" rel="noopener">打开原文 ↗</a>
        </span>
      </header>
      <article id="readerBody" class="reader-body prose"></article>
      <section id="readerReplies" class="reader-replies" hidden></section>
      <section id="readerAttached" class="reader-attached" hidden></section>
      <section id="readerComments" class="cm-box reader-cm-box" hidden></section>
    </div>
  </div>

  <div id="cmSheet" class="cm-sheet" hidden>
    <div class="cm-sheet-backdrop" data-close></div>
    <div class="cm-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="cmSheetTitle">
      <div class="cm-sheet-head">
        <span class="cm-grab" aria-hidden="true"></span>
        <div class="cm-sheet-title-wrap"><span class="cm-sheet-label">✎ 评论</span><div class="cm-sheet-title" id="cmSheetTitle"></div></div>
        <button type="button" class="cm-sheet-close" data-close aria-label="关闭">✕</button>
      </div>
      <div id="cmSheetBody" class="cm-box cm-sheet-box"></div>
    </div>
  </div>

  <div id="syncDialog" class="sync-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="syncTitle">
    <div class="sync-panel">
      <div class="sync-head"><h3 id="syncTitle">☁ 云同步</h3><button type="button" class="sync-x" data-sync-close aria-label="关闭">✕</button></div>
      <p class="sync-msg" id="syncMsg"></p>
      <p class="sync-note">关注和评论保存在你的 Cloudflare Worker，本浏览器只做缓存；离线时的修改会在恢复网络后自动上传。</p>
      <div class="sync-actions"><button type="button" class="btn ghost sm" id="syncLogout">退出登录</button><span class="spacer"></span>
        <button type="button" class="btn ghost sm" id="syncNow">立即同步</button><button type="button" class="btn primary sm" data-sync-close>完成</button></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="图片预览">
    <button type="button" class="lb-close" aria-label="关闭">×</button>
    <button type="button" class="lb-nav lb-prev" aria-label="上一张">‹</button>
    <figure class="lb-fig"><img id="lbImg" alt="" /><figcaption id="lbCap"></figcaption></figure>
    <button type="button" class="lb-nav lb-next" aria-label="下一张">›</button>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="static/calendar.js?v=f216389086"></script>
  <script src="static/export-core.js?v=c1825fd651"></script>
  <script src="static/app.js?v=3936236f86"></script>
</body>
</html>
