<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090D24"/>
      <stop offset="0.55" stop-color="#271A5C"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="512" cy="590" r="560">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#F43F5E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="above"><rect width="1024" height="590"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>

  <!-- faint stars -->
  <g fill="#fff">
    <circle cx="190" cy="210" r="7" opacity="0.55"/>
    <circle cx="300" cy="130" r="4" opacity="0.4"/>
    <circle cx="820" cy="170" r="6" opacity="0.5"/>
    <circle cx="880" cy="320" r="4" opacity="0.35"/>
    <circle cx="140" cy="390" r="4" opacity="0.3"/>
    <path transform="translate(770 290)" d="M0 -26 Q5 -5 26 0 Q5 5 0 26 Q-5 5 -26 0 Q-5 -5 0 -26Z" opacity="0.7"/>
  </g>

  <!-- rising sun -->
  <circle cx="512" cy="590" r="280" fill="url(#sun)" clip-path="url(#above)"/>

  <!-- AI sparkle -->
  <g transform="translate(512 440)" filter="url(#glow)">
    <path d="M0 -210 Q36 -36 210 0 Q36 36 0 210 Q-36 36 -210 0 Q-36 -36 0 -210Z" fill="#fff"/>
  </g>

  <!-- news lines / horizon -->
  <rect x="202" y="636" width="620" height="54" rx="27" fill="#fff"/>
  <rect x="272" y="730" width="480" height="54" rx="27" fill="#fff" opacity="0.62"/>
  <rect x="352" y="824" width="320" height="54" rx="27" fill="#fff" opacity="0.3"/>
</svg>
